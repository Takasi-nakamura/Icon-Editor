<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>LINE 友達追加</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#photo{width:min(100vw,100vh);height:min(100vw,100vh);object-fit:contain;display:none}
#setup{font-family:system-ui,sans-serif;text-align:center;padding:24px}
#setup h1{font-size:24px;margin:0 0 12px}
#setup p{color:#666}
button{border:0;border-radius:14px;background:#111;color:#fff;font-size:18px;font-weight:700;padding:16px 28px}
input{display:none}
</style>
</head>
<body>
<img id="photo" alt="設定した写真">
<div id="setup"><h1>LINE 友達追加</h1><p>最初に表示する写真を設定してください。</p><input id="file" type="file" accept="image/*"><button onclick="file.click()">写真を設定</button></div>
<script>
const KEY='line-friend-photo-v2',photo=document.getElementById('photo'),setup=document.getElementById('setup'),file=document.getElementById('file');
function show(src){photo.src=src;photo.style.display='block';setup.style.display='none'}
const saved=localStorage.getItem(KEY);if(saved)show(saved);
file.onchange=()=>{
  const f=file.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      localStorage.setItem(KEY,r.result);
      show(r.result);
    }catch(e){
      alert('この画像は保存容量を超えています。別の画像を選んでください。');
    }
  };
  r.readAsDataURL(f);
};
</script>
</body>
</html>
